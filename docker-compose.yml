services:
  db:
    image: postgres:18-alpine
    container_name: mdm-postgres
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    volumes:
      - mdm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: mdm-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ccdev
      DB_USER: ccdev
      DB_PASSWORD: ccdev
      AUTO_INIT: "true"
      RESET_ON_START: "false"
    ports:
      - "18080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: mdm-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mdm-pgdata:
